[package]
name = "game-text-beacon"
version = "0.1.2"
description = "Read local game text from a chosen screen region"
authors = ["Param Factory"]
edition = "2021"

[lib]
name = "game_text_beacon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Keep the capture/OCR core testable on a clean Rust installation. The GUI
# feature is explicitly enabled by Tauri packaging, where the platform GTK /
# WebKit prerequisites are installed.
default = []
desktop = ["dep:base64", "dep:image", "dep:tauri", "dep:tauri-plugin-global-shortcut", "dep:xcap"]

[[bin]]
name = "game-text-beacon"
path = "src/main.rs"
test = false
bench = false
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:base64", "dep:image", "dep:tauri", "dep:tauri-plugin-global-shortcut", "dep:xcap", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
base64 = { version = "0.22", optional = true }
image = { version = "0.25", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
xcap = { version = "0.4.0", optional = true }
