[package]
name = "game-text-beacon"
version = "0.1.1"
description = "Read local game text from a chosen screen region"
authors = ["Param Factory"]
edition = "2021"

[lib]
name = "game_text_beacon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "game-text-beacon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
xcap = "0.0.14"
