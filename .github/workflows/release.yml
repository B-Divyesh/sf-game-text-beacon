name: Release desktop packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        run: echo "value=${GITHUB_REF_NAME:-v0.1.0}" >> "$GITHUB_OUTPUT"
      - name: Create the draft release for all platform assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Game Text Beacon ${{ steps.tag.outputs.value }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install macOS universal Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux Tauri and local OCR prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file tesseract-ocr
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: Game Text Beacon ${{ needs.create-release.outputs.tag }}
          releaseDraft: false
          prerelease: false
          args: --features desktop ${{ matrix.args }}

  manifest:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # `gh release` needs a repository context. The prior job had no
      # checkout, so its otherwise successful package builds could never
      # download or upload release metadata.
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          gh release download "$TAG" --dir "$release_dir" --pattern '*.dmg' --pattern '*.exe' --pattern '*.msi' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' --pattern '*.tar.gz'
          (
            cd "$release_dir"
            find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | while IFS= read -r asset; do sha256sum "$asset"; done
          ) > SHA256SUMS
          gh release view "$TAG" --json assets --jq '.assets | map(select(.name | test("\\.(dmg|exe|msi|AppImage|deb|rpm|tar\\.gz)$")) | {name: .name, url: .browser_download_url})' > assets.json
          python3 - <<'PY'
          import json, os
          from urllib.parse import quote
          assets=json.load(open('assets.json'))
          tag=os.environ['TAG']
          repository=os.environ['GITHUB_REPOSITORY']
          # `gh release view --json assets` exposes an API URL field, not the
          # browser download URL. Construct the documented release navigation
          # URLs from the immutable tag and exact asset names instead.
          urls={a['name']:f"https://github.com/{repository}/releases/download/{tag}/{quote(a['name'])}" for a in assets}
          assert urls and all(urls.values())
          json.dump({'version':os.environ['TAG'], 'assets':urls}, open('latest.json','w'), indent=2)
          PY
          gh release upload "$TAG" SHA256SUMS latest.json --clobber
